  return `rgba(${r},${g},${b},${a})`;
}

}

// ─── GENERATION LOGIC ─────────────────────────────────────────────────────────
function buildFmt(fmt, tmp, epiFrom, epiTo, epi) {
  if (fmt !== 'SER') return fmt;
  return `SER_S${String(tmp).padStart(2,'0')}_E${String(epi!==undefined?epi:epiFrom).padStart(4,'0')}`;
}
function generateNames({ref,titol,fmt,tmp,epiFrom,epiTo,vxx,prfs,langs,visuals,length,taBlocks,genVideo,genAudio,inclExt}) {
  if (!ref||!titol||prfs.length===0||langs.length===0) return [];
  if (!genVideo&&!genAudio) return [];
  const vStr = () => 'V' + String(vxx).padStart(2, '0');
  const episodes = fmt==='SER' ? Array.from({length:epiTo-epiFrom+1},(_,i)=>epiFrom+i) : [null];
  return episodes.map(epi => {
    const fmtSeg = buildFmt(fmt,tmp,epiFrom,epiTo,epi);
    const video=[],audio=[];
    for (const prf of prfs) for (const lang of langs) {
      const ver = lang.state==='pin'?'ORG':'ALT';
      if (genVideo && visuals.length>0) for (const vis of visuals) {
        const name = `${ref}-N-${titol}-N-${fmtSeg}-${prf}-${lang.code}-${ver}-${vis}-${length}-XXX-${vStr()}${inclExt?'.mov':''}`;
        video.push({name, segments:[
          {t:'REF',v:ref},{t:'SEP',v:'-N-'},{t:'TIT',v:titol},{t:'SEP',v:'-N-'},
          {t:'FMT',v:fmtSeg},{t:'SEP',v:'-'},{t:'PRF',v:prf},{t:'SEP',v:'-'},
          {t:'IDI',v:lang.code},{t:'SEP',v:'-'},{t:'VER',v:ver},{t:'SEP',v:'-'},
          {t:'VIS',v:vis},{t:'SEP',v:'-'},{t:'LS',v:length},{t:'SEP',v:'-'},
          {t:'TA',v:'XXX'},{t:'SEP',v:'-'},{t:'VXX',v:vStr()},
          ...(inclExt?[{t:'EXT',v:'.mov'}]:[]),
        ]});
      }
      if (genAudio) for (const blk of taBlocks) for (const ch of blk.channels) {
        const taStr=`${blk.id}_${ch}`;
        const name=`${ref}-N-${titol}-N-${fmtSeg}-${prf}-${lang.code}-${ver}-XXX-${length}-${taStr}-${vStr()}${inclExt?'.wav':''}`;
        audio.push({name, segments:[
          {t:'REF',v:ref},{t:'SEP',v:'-N-'},{t:'TIT',v:titol},{t:'SEP',v:'-N-'},
          {t:'FMT',v:fmtSeg},{t:'SEP',v:'-'},{t:'PRF',v:prf},{t:'SEP',v:'-'},
          {t:'IDI',v:lang.code},{t:'SEP',v:'-'},{t:'VER',v:ver},{t:'SEP',v:'-'},
          {t:'VIS',v:'XXX'},{t:'SEP',v:'-'},{t:'LS',v:length},{t:'SEP',v:'-'},
          {t:'TA',v:taStr},{t:'SEP',v:'-'},{t:'VXX',v:vStr()},
          ...(inclExt?[{t:'EXT',v:'.wav'}]:[]),
        ]});
      }
    }
    return {epi,video,audio};
  });
}

// ─── PARSER ───────────────────────────────────────────────────────────────────
const FMT_VALS=new Set(['FTR','TLR','SPT']);
const PRF_VALS=new Set(['MASTER','BR','DCP','SD']);
const VER_VALS=new Set(['ORG','ALT']);
const LS_VALS=new Set(['S','L']);
const TA_VALS=new Set(['MIX','ME','DX','XXX']);
const CN_VALS=new Set(['1','2_0','5_1','7_1_4']);
const LANG_CODES=new Set(LANGS.map(l=>l.code));
const VIS_VALS=new Set(['XXX','GRA','INT','SBT','GRA_INT','GRA_SBT']);

function parseName(raw) {
  if (!raw||!raw.trim()) return null;
  const result={raw,fields:{},errors:[]};
  let w=raw.trim();
  const extM=w.match(/\.(mov|wav|mp4|mxf|aif|aiff|flac)$/i);
  if (extM) { result.fields.ext=extM[0].toLowerCase(); w=w.slice(0,-extM[0].length); }
  const nP=w.split('-N-');
  if (nP.length>=3) { result.fields.ref=nP[0]; result.fields.titol=nP[1]; w=nP.slice(2).join('-N-'); }
  else if (nP.length===2) { result.fields.ref=nP[0]; w=nP[1]; }
  else { result.errors.push('No s\'ha trobat el separador -N-'); w=nP[0]; }
  const segs=w.split('-'); let i=0;
  if (i<segs.length) {
    const s=segs[i];
    if (FMT_VALS.has(s)) { result.fields.fmt=s; i++; }
    else if (s.startsWith('SER')) {
      result.fields.fmt='SER';
      const tm=s.match(/S(\d+)/),em=s.match(/E(\d+)/);
      if(tm) result.fields.tmp=tm[1]; if(em) result.fields.epi=em[1]; i++;
    } else { result.errors.push(`FMT: ${s}`); result.fields.fmt='?'; i++; }
  }
  const tryField=(set,key)=>{ if(i<segs.length){ if(set.has(segs[i])){result.fields[key]=segs[i++];}else{result.errors.push(`${key.toUpperCase()}: ${segs[i]}`);result.fields[key]=segs[i++];} } };
  tryField(PRF_VALS,'prf'); tryField(LANG_CODES,'idi'); tryField(VER_VALS,'ver'); tryField(VIS_VALS,'vis'); tryField(LS_VALS,'ls');
  if (i<segs.length) {
    const ts=segs[i];
    if(ts==='XXX'){result.fields.ta='XXX';result.fields.cn=null;i++;}
    else{ const tp=ts.split('_'); if(TA_VALS.has(tp[0])){result.fields.ta=tp[0];result.fields.cn=tp.slice(1).join('_')||null;i++;}
    else{result.errors.push(`TA: ${ts}`);result.fields.ta=ts;i++;} }
  }
  if (i<segs.length) { const vs=segs[i]; if(/^V\d{2}$/.test(vs)){result.fields.vxx=vs;i++;}else{result.errors.push(`VXX: ${vs}`);result.fields.vxx=vs;i++;} }
  if (i<segs.length) result.fields.rest=segs.slice(i).join('-');
  result.fields.type = result.fields.ta==='XXX'?'VÍDEO':result.fields.ta?'ÀUDIO':'?';
  return result;
}

function isColorDark(hex) {
  const h = hex.replace('#','');
  const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
  return (0.299*r + 0.587*g + 0.114*b) < 128;
}

function applyTheme(theme, customBg) {
  const isDark = customBg ? isColorDark(customBg) : (theme ? theme.dark : true);
  const bg = customBg || (theme ? theme.bg : '#1e1e2e');
  document.body.style.background = bg;
  if (isDark) {
    T.text='#f2f2fc'; T.text2='#aaaac8'; T.text3='#7070a0'; T.dark=true;
    T.surface='rgba(255,255,255,0.05)'; T.border='rgba(255,255,255,0.11)'; T.borderBright='rgba(255,255,255,0.20)';
  } else {
    T.text='#111112'; T.text2='#44445a'; T.text3='#8888a0'; T.dark=false;
    T.surface='rgba(0,0,0,0.04)'; T.border='rgba(0,0,0,0.10)'; T.borderBright='rgba(0,0,0,0.18)';
  }
}

// Copy button with satisfying click animation
function CopyBtn({text, small, gold, iconOnly, disabled}) {
  const [st, setSt] = useState('idle'); // idle | press | done
  const timersRef = useRef([]);
  const handle = () => {
    timersRef.current.forEach(clearTimeout);
    timersRef.current = [];
    setSt('press');
    if (window.bridge) {
      window.bridge.copy_to_clipboard(text);
    } else {
      const legacyCopy = () => {
        try {
          const el = document.createElement('textarea');
          el.value = text;
          el.style.cssText = 'position:fixed;opacity:0;pointer-events:none;';
          document.body.appendChild(el);
          el.select();
          document.execCommand('copy');
          document.body.removeChild(el);
        } catch(e) {}
      };
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).catch(legacyCopy);
      } else {
        legacyCopy();
      }
    }
    timersRef.current.push(setTimeout(()=>setSt('done'), 80));
    timersRef.current.push(setTimeout(()=>setSt('idle'), 1800));
  };
  useEffect(() => () => timersRef.current.forEach(clearTimeout), []);
  const isDone = st==='done', isPress = st==='press';
  if (gold) return (
    <button onClick={disabled ? undefined : handle} style={{
      padding: small?'3px 9px':'5px 13px', borderRadius: 6, fontSize: 10, fontWeight: 600,
      cursor: disabled?'default':'pointer', border:'1px solid', whiteSpace:'nowrap', flexShrink:0,
      background: disabled?'rgba(120,53,15,0.10)': isDone?'rgba(245,158,11,0.15)':'rgba(120,53,15,0.3)',
      borderColor: disabled?'rgba(120,53,15,0.25)': isDone?'rgba(245,158,11,0.6)':'rgba(120,53,15,0.6)',
      color: disabled?'rgba(217,119,6,0.35)': isDone?'#fbbf24':'#d97706',
      opacity: disabled ? 0.5 : 1,
      transform: isPress?'scale(0.94)':'scale(1)',
      boxShadow: (disabled||isPress)?'none':'0 1px 4px rgba(0,0,0,0.4)',
      transition:'all 0.12s',
    }}>{isDone?'✓':'📋'}</button>
  );
  return (
    <button onClick={handle} style={{
      padding: small?'3px 9px':'5px 13px', borderRadius: 6, fontSize: 10, fontWeight: 600,
      cursor:'pointer', border:'1px solid', whiteSpace:'nowrap', flexShrink:0,
      background: isDone?'rgba(99,102,241,0.15)':'rgba(255,255,255,0.04)',
      borderColor: isDone?'rgba(124,127,245,0.6)':'rgba(255,255,255,0.1)',
      color: isDone?'#a5b4fc':T.text2,
      transform: isPress?'scale(0.94)':'scale(1)',
      boxShadow: isPress?'none':'0 1px 4px rgba(0,0,0,0.4), 0 1px 0 rgba(255,255,255,0.05) inset',
      transition:'all 0.12s',

  );
}

  return (

      title={title} onClick={onClick}
      onMouseEnter={()=>setHov(true)} onMouseLeave={()=>{setHov(false);setPress(false);}}
      onMouseDown={()=>setPress(true)} onMouseUp={()=>setPress(false)}
      style={{
        padding:'5px 13px', borderRadius:20, fontSize:11.5, fontWeight:600,
        cursor:'pointer', userSelect:'none', transition:'all 0.15s',
        background:bg, border, color, boxShadow:shadow,
        transform: press ? 'scale(0.93)' : 'scale(1)',
      }}
    >{children}</div>
  );
}

// Collapsible section
function CollapsibleSection({title, count, defaultOpen=true, children}) {
  const [open, setOpen] = useState(defaultOpen);
  return (
    <div>
      <div onClick={()=>setOpen(o=>!o)} style={{display:'flex',alignItems:'center',gap:7,cursor:'pointer',padding:'5px 0',userSelect:'none'}}>
        <span style={{fontSize:9, color:T.text3, transition:'transform 0.2s', display:'inline-block', transform:open?'rotate(0)':'rotate(-90deg)'}}>▼</span>
        <span style={{fontSize:9.5,fontWeight:700,letterSpacing:'1.5px',textTransform:'uppercase',color:T.text3}}>{title}</span>
        {count!==undefined && <span style={{fontSize:9,background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.08)',borderRadius:10,padding:'1px 7px',color:T.text3}}>{count}</span>}
      </div>
      {open && <div className="fade-up">{children}</div>}
    </div>
  );
}

// ─── TAB 1: CREAR NOMS ────────────────────────────────────────────────────────
function Tab1({tweaks, setTweak, tweakColors, glowA, taBlocksDynamic}) {
  const [ref, setRef] = useState('');
  const [titolRaw, setTitolRaw] = useState('');
  const [titol, setTitol] = useState('');
  const [fmt, setFmt] = useState('FTR');
  const [tmp, setTmp] = useState(1);
  const [epiFrom, setEpiFrom] = useState(1);
  const [epiTo, setEpiTo] = useState(3);
  const [prfs, setPrfs] = useState(['MASTER']);
  const [langStates, setLangStates] = useState({EN:'pin',ES:'sel',CA:'sel'});
  const [visuals, setVisuals] = useState(['XXX']);
  const [length, setLength] = useState('S');
  const [vxx, setVxx] = useState(1);
  const [taActive, setTaActive] = useState({MIX:true,ME:false,DX:false});
  const [taChannels, setTaChannels] = useState({MIX:['2_0'],ME:[],DX:[]});
  const [genVideo, setGenVideo] = useState(true);
  const [genAudio, setGenAudio] = useState(true);
  const [results, setResults] = useState(null);
  const [openEpisode, setOpenEpisode] = useState(0);
  const [error, setError] = useState('');
  const [copied, setCopied] = useState(false);
  const [a1Open, setA1Open] = useState(true);
  const [a2Open, setA2Open] = useState(true);

  const normTitol = v => v.trim().replace(/\s+/g,'_').toUpperCase();
  const activeLangs = LANGS.filter(l=>langStates[l.code]).map(l=>({code:l.code,state:langStates[l.code]}));
  const activeBlocks = TA_BLOCKS.filter(b=>taActive[b.id]).map(b=>({id:b.id,channels:taChannels[b.id]||[]})).filter(b=>b.channels.length>0);

  const handleGenerate = () => {
    const t = normTitol(titol);
    if (!ref.trim()) { setError('Cal emplenar la Referència.'); return; }
    if (!t) { setError('Cal emplenar el Títol.'); return; }
    if (prfs.length===0) { setError('Cal seleccionar almenys un Perfil (PRF).'); return; }
    if (activeLangs.length===0) { setError('Cal seleccionar almenys un Idioma.'); return; }
    if (!genVideo&&!genAudio) { setError('Cal activar vídeos o àudios.'); return; }
    if (fmt==='SER' && (epiTo-epiFrom+1) > 500) { setError(`Massa episodis (${epiTo-epiFrom+1}). Redueix el rang (màxim 500).`); return; }
    if (genVideo && visuals.length===0 && !genAudio) { setError('Cal seleccionar almenys un VIS per generar vídeos.'); return; }
    if (genAudio && activeBlocks.length===0) { setError('Cal seleccionar almenys un bloc TA actiu per generar àudios.'); return; }
    setError('');
    setResults(generateNames({ref:ref.trim(),titol:t,fmt,tmp,epiFrom,epiTo,vxx,prfs,langs:activeLangs,visuals,length,taBlocks:activeBlocks,genVideo,genAudio,inclExt:tweaks.showExtension}));
    setOpenEpisode(0);
  };

  const allNames = results ? results.flatMap(ep=>[...ep.video.map(n=>n.name),...ep.audio.map(n=>n.name)]) : [];

  const cycleLang = code => {
    setLangStates(ls => {
      const pins = Object.values(ls).filter(s=>s==='pin').length;
      const cur=ls[code];
      if(!cur) return {...ls,[code]:'sel'};
      if(cur==='sel') { if(pins<2) return {...ls,[code]:'pin'}; const {[code]:_,...r}=ls; if(Object.keys(r).length===0) return ls; return r; }
      const {[code]:_,...r}=ls; if(Object.keys(r).length===0) return ls; return r;
    });
  };
  const toggleTaBlock = id => {
    setTaActive(prev => {
      const was=prev[id];
      const next={...prev,[id]:!was};
      if(!was){ setTaChannels(tc=>{ const def=TA_BLOCKS.find(b=>b.id===id)?.defCh||'2_0'; return {...tc,[id]:[def]}; }); }
      setGenAudio(Object.values(next).some(Boolean));
      return next;
    });
  };
  const toggleCn = (bId,ch) => setTaChannels(tc=>{
    const cur=tc[bId]||[];
    if(cur.includes(ch)&&cur.length<=1) return tc;
    return {...tc,[bId]:cur.includes(ch)?cur.filter(c=>c!==ch):[...cur,ch]};
  });
  const toggleAudio = v => {
    setGenAudio(v);
    if(v){ const any=Object.values(taActive).some(Boolean); if(!any){setTaActive(t=>({...t,MIX:true}));setTaChannels(t=>({...t,MIX:['2_0']}));} }
    else { setTaActive({MIX:false,ME:false,DX:false}); setTaChannels({MIX:[],ME:[],DX:[]}); }
  };

  const gap = tweaks.density==='compact' ? 7 : 11;
  const isSER = fmt==='SER';
  const tc = tweakColors || {prf:'#22d3ee',vis:'#a78bfa',fmt:'#4ade80',idi:'#f472b6'};
  const glow = glowA || 0.22;
  const taBlocks = taBlocksDynamic || TA_BLOCKS;

  
  const scrollRef = useRef(null);
  const btnRef   = useRef(null);
  const syncScroll = e => { if (btnRef.current) btnRef.current.scrollTop = e.target.scrollTop; };

  const isDarkTab = T.dark !== false;
  const sepColor  = isDarkTab ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.08)';
  const hdrBg     = isDarkTab ? 'rgba(255,255,255,0.025)' : 'rgba(0,0,0,0.025)';
  const panelBg   = T.bg || '#1e1e2e';
  const BTN_COL_W = 92;

  // Flat item list for the two-panel results display
  const flatItems = [];
  if (results && results.length > 0) {
    if (fmt === 'SER') {
      results.forEach((ep, epIdx) => {
        const fmtStr = buildFmt(fmt,tmp,epiFrom,epiTo,ep.epi);
        const allEp  = [...ep.video.map(n=>n.name),...ep.audio.map(n=>n.name)];
        flatItems.push({type:'episode',h:36,label:fmtStr,allNames:allEp,epIdx});
        if (openEpisode===epIdx) {
          if (ep.video.length>0){
            flatItems.push({type:'section',h:30,title:'VÍDEO (.MOV)',allNames:ep.video.map(n=>n.name)});
            ep.video.forEach((n,nameIdx)=>flatItems.push({type:'row',h:44,n,section:'video',nameIdx}));
          }
          if (ep.audio.length>0){
            flatItems.push({type:'section',h:30,title:'ÀUDIO (.WAV)',allNames:ep.audio.map(n=>n.name)});
            ep.audio.forEach((n,nameIdx)=>flatItems.push({type:'row',h:44,n,section:'audio',nameIdx}));
          }
        }
      });
    } else {
      if (results[0]?.video.length>0){
        flatItems.push({type:'section',h:30,title:'VÍDEO (.MOV)',allNames:results[0].video.map(n=>n.name)});
        results[0].video.forEach((n,nameIdx)=>flatItems.push({type:'row',h:44,n,section:'video',nameIdx}));
      }
      if (results[0]?.audio.length>0){
        flatItems.push({type:'section',h:30,title:'ÀUDIO (.WAV)',allNames:results[0].audio.map(n=>n.name)});
        results[0].audio.forEach((n,nameIdx)=>flatItems.push({type:'row',h:44,n,section:'audio',nameIdx}));
      }
    }
  }

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%',minHeight:0}}>

      {/* ── APARTAT 1: Configuració (alçada natural, no creix) ─────── */}
      <div style={{flexShrink:0,borderBottom:`1px solid ${sepColor}`}}>
        <div onClick={()=>setA1Open(v=>!v)} style={{
          display:'flex',alignItems:'center',gap:8,padding:'10px 20px',
          cursor:'pointer',userSelect:'none',background:hdrBg,
        }}>
          <span style={{fontSize:9,color:T.text3,transition:'transform 0.2s',display:'inline-block',transform:a1Open?'':'rotate(-90deg)'}}>▼</span>
          <span style={{fontSize:11,fontWeight:700,color:T.text2,letterSpacing:'0.05em',textTransform:'uppercase'}}>Configuració</span>
        </div>
        {a1Open && (
        <div className="scroll-vis" style={{padding:'12px 20px 16px',display:'flex',flexDirection:'column',gap,maxHeight:380,overflowY:'auto'}}>

      {/* REF + TÍTOL */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 3fr',gap}}>
        <Card>
          <SectionLabel>REF — Referència</SectionLabel>
          <input value={ref} onChange={e=>setRef(e.target.value)} placeholder="ex: 1983" style={{width:'100%'}} />
        </Card>
        <Card>
          <SectionLabel>TÍTOL</SectionLabel>
          <input value={titolRaw} onChange={e=>{setTitolRaw(e.target.value);setTitol(e.target.value);}}
            onBlur={e=>{const v=normTitol(e.target.value);setTitolRaw(v);setTitol(v);}}
            placeholder="ex: BABA_YAGA_Y_EL_LIBRO_DE_HECHIZOS" style={{width:'100%'}} />
        </Card>
      </div>

      {/* FMT */}
      <Card>
        <SectionLabel>FMT — Tipus de referència</SectionLabel>
        <div style={{display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
          <div style={{display:'flex',gap:5}}>
            {FMT_OPTIONS.map(f=>(
              <PillBtn key={f.val} active={fmt===f.val} title={f.tip} onClick={()=>setFmt(f.val)}
                activeColor={hexToRgba(tc.fmt,0.35)} activeTextColor={tc.fmt}>
                {f.val}
              </PillBtn>
            ))}
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,flex:1,minWidth:260,
            opacity:isSER?1:0.3,pointerEvents:isSER?'auto':'none',transition:'opacity 0.2s'}}>
            {[{label:'Temporada',val:tmp,set:setTmp,min:1,max:99},
              {label:'Episodi des de',val:epiFrom,set:v=>{setEpiFrom(v);if(v>=epiTo)setEpiTo(v+1);},min:1,max:9998},
              {label:'Episodi fins a',val:epiTo,set:v=>setEpiTo(Math.max(epiFrom+1,v)),min:2,max:9999}
            ].map(({label,val,set,min,max},k)=>(
              <div key={k}>
                <div style={{fontSize:10,color:T.text3,marginBottom:3}}>{label}</div>
                <input type="number" value={val} min={min} max={max}
                  onChange={e=>{const n=parseInt(e.target.value);if(!isNaN(n))set(Math.max(min,Math.min(max,n)));}}
                  onBlur={e=>{const n=parseInt(e.target.value);set(isNaN(n)?min:Math.max(min,Math.min(max,n)));}}
                  style={{width:'100%'}} />
              </div>
            ))}
          </div>
        </div>
      </Card>

      {/* PRF + IDI */}
      <div style={{display:'flex',gap}}>
        <Card style={{flexShrink:0}}>
          <SectionLabel>PRF — Perfil / Destí</SectionLabel>
          <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
            {PRF_OPTIONS.map(p=>(
              <PillBtn key={p} active={prfs.includes(p)} onClick={()=>setPrfs(ps=>ps.includes(p)?ps.filter(x=>x!==p):[...ps,p])}
                activeColor={hexToRgba(tc.prf,0.35)} activeTextColor={tc.prf}>{p}</PillBtn>
            ))}
          </div>
          <div style={{fontSize:9.5,color:T.text3,marginTop:5}}>Selecció múltiple</div>
        </Card>
        <Card style={{flex:1}}>
          <SectionLabel>IDI — Idiomes</SectionLabel>
          <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
            {LANGS.map(l=>{
              const st=langStates[l.code], isSel=st==='sel', isPin=st==='pin';
              const idiColor = tc.idi || '#f472b6';
              const pinColor = '#f59e0b';
              return (
                <div key={l.code} onClick={()=>cycleLang(l.code)} title={l.name} style={{
                  padding:'5px 11px',borderRadius:8,fontSize:11.5,fontWeight:700,
                  cursor:'pointer',userSelect:'none',transition:'all 0.15s',
                  background: isPin?hexToRgba(pinColor,0.2):isSel?hexToRgba(idiColor,0.2):(T.dark?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.07)'),
                  border: isPin?`1px solid ${hexToRgba(pinColor,0.55)}`:isSel?`1px solid ${hexToRgba(idiColor,0.45)}`:(T.dark?'1px solid rgba(255,255,255,0.11)':'1px solid rgba(0,0,0,0.14)'),
                  color: isPin?(T.dark?pinColor:darkenHex(pinColor,0.55)):isSel?(T.dark?idiColor:darkenHex(idiColor,0.55)):T.text2,
                  boxShadow: (isPin||isSel)?`0 2px 8px rgba(0,0,0,0.2), 0 0 10px ${hexToRgba(isPin?pinColor:idiColor,glow*0.8)}`:(T.dark?'none':'0 1px 3px rgba(0,0,0,0.07)'),
                }}>{l.code}</div>
              );
            })}
          </div>
          <div style={{fontSize:9.5,color:T.text3,marginTop:6,display:'flex',gap:8}}>
            <span><span style={{color:tc.idi}}>●</span> Color = ALT</span>
            <span><span style={{color:'#f59e0b'}}>●</span> Taronja = ORG (pin, màx. 2)</span>
          </div>
        </Card>
      </div>

      {/* VIS + L/S + VER */}
      <div style={{display:'flex',gap}}>
        <Card style={{flex:3}}>
          <SectionLabel>VIS — Estat visual</SectionLabel>
          <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
            {VIS_OPTIONS.map(v=>(
              <PillBtn key={v.val} active={visuals.includes(v.val)} title={v.tip}
                onClick={()=>setVisuals(vs=>vs.includes(v.val)?vs.filter(x=>x!==v.val):[...vs,v.val])}
                activeColor={hexToRgba(tc.vis,0.35)} activeTextColor={tc.vis}>{v.val}</PillBtn>
            ))}
          </div>
          <div style={{fontSize:9.5,color:T.text3,marginTop:5}}>Selecció múltiple · àudio sempre XXX</div>
        </Card>
        <Card>
          <SectionLabel>Longitud</SectionLabel>
          <div style={{display:'flex',gap:5}}>
            {['Short','Long'].map(l=>(
              <PillBtn key={l} active={length===(l==='Short'?'S':'L')} onClick={()=>setLength(l==='Short'?'S':'L')}
                activeColor={hexToRgba(tweaks.accentColor||'#7c7ff5',0.35)} activeTextColor={tweaks.accentColor||'#a5b4fc'}>{l}</PillBtn>
            ))}
          </div>
        </Card>
        <Card>
          <SectionLabel>Versió (VXX)</SectionLabel>
          <div style={{display:'flex',alignItems:'center',gap:5}}>
            <span style={{fontSize:12.5,fontWeight:600,color:T.text2}}>V</span>
            <input type="number" value={vxx} min={1} max={99} style={{width:58}}
              onChange={e=>{const n=parseInt(e.target.value);if(!isNaN(n))setVxx(Math.max(1,Math.min(99,n)));}}
              onBlur={e=>{const n=parseInt(e.target.value);setVxx(isNaN(n)?1:Math.max(1,Math.min(99,n)));}} />
          </div>
          <div style={{fontSize:9.5,color:T.text3,marginTop:4}}>V01 – V99</div>
        </Card>
      </div>

      {/* TA × CN */}
      <Card>
        <SectionLabel>TA · CN — Tipus d'àudio × Canals</SectionLabel>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {taBlocks.map(block=>{
            const isActive=taActive[block.id];
            return (
              <div key={block.id} style={{
                flex:1, minWidth:170, borderRadius:9, padding:'9px 12px',
                background: isActive?`rgba(255,255,255,0.07)`:'rgba(255,255,255,0.03)',
                border: `1px solid ${isActive?`${block.color}55`:'rgba(255,255,255,0.08)'}`,
                boxShadow: isActive?`0 0 20px ${block.color}22, 0 2px 10px rgba(0,0,0,0.2), 0 1px 0 rgba(255,255,255,0.08) inset`:'none',
                display:'flex',alignItems:'center',gap:9,
                transition:'all 0.2s',
                opacity: isActive?1:0.45,
              }}>
                <div onClick={()=>toggleTaBlock(block.id)} style={{
                  padding:'5px 13px', borderRadius:20, fontSize:12, fontWeight:700,
                  cursor:'pointer', userSelect:'none', flexShrink:0, transition:'all 0.15s',
                  background: isActive?`${block.color}33`:'rgba(255,255,255,0.04)',
                  border: `1px solid ${isActive?`${block.color}66`:'rgba(255,255,255,0.08)'}`,
                  color: isActive?block.color:T.text3,
                  boxShadow: isActive?`0 2px 8px rgba(0,0,0,0.4), 0 0 10px ${block.color}22`:'none',
                }}>{block.label}</div>
                <div style={{display:'flex',gap:4,flexWrap:'wrap',opacity:isActive?1:0.3,pointerEvents:isActive?'auto':'none',transition:'opacity 0.2s'}}>
                  {CN_OPTIONS.map(cn=>{
                    const active=(taChannels[block.id]||[]).includes(cn);
                    return (
                      <div key={cn} onClick={()=>toggleCn(block.id,cn)} style={{
                        padding:'3px 9px',borderRadius:16,fontSize:10.5,fontWeight:600,
                        cursor:'pointer',userSelect:'none',transition:'all 0.12s',
                        background: active?`${block.color}22`:'rgba(255,255,255,0.03)',
                        border: `1px solid ${active?`${block.color}55`:'rgba(255,255,255,0.07)'}`,
                        color: active?block.color:T.text3,
                        boxShadow: active?`0 1px 4px rgba(0,0,0,0.3)`:'none',
                      }}>{cn}</div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
        <div style={{fontSize:9.5,color:T.text3,marginTop:7}}>Activa el tipus per habilitar canals · genera totes les combinacions actives</div>
      </Card>

        </div>
        )}
      </div>
      {/* ── fi Apartat 1 ── */}

      {/* ── APARTAT 2: Resultats (flex:1, dos panells) ───────────── */}
      <div style={{flex:1,minHeight:0,display:'flex',flexDirection:'column'}}>
        <div onClick={()=>setA2Open(v=>!v)} style={{
          flexShrink:0,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 20px',
          cursor:'pointer',userSelect:'none',background:hdrBg,
          borderBottom:`1px solid ${sepColor}`,
        }}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span style={{fontSize:9,color:T.text3,transition:'transform 0.2s',display:'inline-block',transform:a2Open?'':'rotate(-90deg)'}}>▼</span>
            <span style={{fontSize:11,fontWeight:700,color:T.text2,letterSpacing:'0.05em',textTransform:'uppercase'}}>Noms generats</span>
            {flatItems.length>0 && <span style={{fontSize:10,color:T.text3,fontWeight:400,marginLeft:2}}>({allNames.length})</span>}
          </div>
          {flatItems.length>0 && <div onClick={e=>e.stopPropagation()}><CopyBtn text={allNames.join('\n')} small iconOnly /></div>}
        </div>
        {a2Open && (
          flatItems.length>0 ? (
            <div style={{flex:1,minHeight:0,position:'relative',overflow:'hidden'}}>
              {/* Panell esquerre: noms amb scroll h+v */}
              <div ref={scrollRef} onScroll={syncScroll} className="scroll-vis" style={{
                position:'absolute',left:0,top:0,bottom:0,right:BTN_COL_W,
                overflowX:'auto',overflowY:'auto',
              }}>
              <div style={{width:'max-content',minWidth:'100%'}}>
                {flatItems.map((item,i)=>{
                  const rowBorder = `1px solid ${sepColor}`;
                  if(item.type==='episode') return (
                    <div key={i} onClick={()=>setOpenEpisode(openEpisode===item.epIdx?-1:item.epIdx)}
                      style={{height:item.h,display:'flex',alignItems:'center',gap:8,padding:'0 12px',
                        background:isDarkTab?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.03)',
                        borderBottom:rowBorder,cursor:'pointer',userSelect:'none',whiteSpace:'nowrap'}}>
                      <span style={{fontSize:9,color:T.text3,display:'inline-block',transition:'transform 0.2s',
                        transform:openEpisode===item.epIdx?'':'rotate(-90deg)'}}>▼</span>
                      <span style={{fontFamily:tweaks.monoFont||'Courier New',fontSize:12,color:'#86efac'}}>{item.label}</span>
                      <span style={{fontSize:9.5,color:T.text3,marginLeft:2}}>{item.allNames.length}</span>
                    </div>
                  );
                  if(item.type==='section') return (
                    <div key={i} style={{height:item.h,display:'flex',alignItems:'center',padding:'0 12px',
                      background:isDarkTab?'rgba(255,255,255,0.015)':'rgba(0,0,0,0.015)',
                      borderBottom:rowBorder,whiteSpace:'nowrap'}}>
                      <span style={{fontSize:10,fontWeight:700,color:T.text2}}>{item.title}</span>
                      <span style={{fontSize:9.5,color:T.text3,marginLeft:6}}>{item.allNames.length}</span>
                    </div>
                  );
                  return (
                    <div key={i} style={{height:item.h,display:'flex',alignItems:'center',padding:'3px 0 3px 8px',
                      borderBottom:`1px solid rgba(255,255,255,0.025)`}}>
                      <NameBox segments={item.n.segments} mono={tweaks.monoFont} plain />
                      <div style={{width:40,flexShrink:0}} />
                    </div>
                  );
                })}
              </div>
              </div>
              {/* Panell dret: botons fixos, sense scrollbar visible, sincronitzat via syncScroll */}
              <div ref={btnRef} className="no-sb" style={{
                position:'absolute',right:0,top:0,bottom:0,width:BTN_COL_W,
                overflowY:'auto',
                borderLeft:`1px solid ${sepColor}`,
              }}>
                {flatItems.map((item,i)=>{
                  const rowBorder = `1px solid ${sepColor}`;
                  if(item.type==='episode') return (
                    <div key={i} style={{height:item.h,display:'flex',alignItems:'center',justifyContent:'center',
                      padding:'0 8px',
                      background:isDarkTab?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.03)',
                      borderBottom:rowBorder}}>
                      <CopyBtn text={item.allNames.join('\n')} small iconOnly />
                    </div>
                  );
                  if(item.type==='section') return (
                    <div key={i} style={{height:item.h,display:'flex',alignItems:'center',justifyContent:'center',
                      padding:'0 8px',
                      background:isDarkTab?'rgba(255,255,255,0.015)':'rgba(0,0,0,0.015)',
                      borderBottom:rowBorder}}>
                      <CopyBtn text={item.allNames.join('\n')} small iconOnly />

                  return (
                    <div key={i} style={{height:item.h,display:'flex',alignItems:'center',justifyContent:'center',

                        background:'rgba(0,0,0,0.20)',border:'1px solid rgba(255,255,255,0.10)',

                      }}>

        <div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:9}}>

            <span key={k} className="seg" style={{background:c.bg,color:c.fg}}>{k}</span>
          ))}
        </div>
        {/* Toggles */}
        <div style={{display:'flex',gap:20,flexWrap:'wrap',marginBottom:10,padding:'2px 0'}}>
          <Toggle on={genVideo} onChange={setGenVideo} label={<>Generar <strong style={{color:T.text,fontWeight:600}}>vídeos</strong></>} />
          <Toggle on={genAudio} onChange={toggleAudio} label={<>Generar <strong style={{color:T.text,fontWeight:600}}>àudios</strong></>} />
          <Toggle on={!!(tweaks&&tweaks.showExtension)} onChange={v=>setTweak&&setTweak('showExtension',v)}
            label={<>Extensió <strong style={{color:T.text,fontWeight:600}}>(.mov / .wav)</strong></>} />
        </div>
        {/* Error */}
        {error && (
          <div style={{background:'rgba(239,68,68,0.08)',border:'1px solid rgba(239,68,68,0.25)',borderRadius:8,padding:'9px 14px',color:'#fca5a5',fontSize:11.5,marginBottom:8}}>
            ⚠ {error}
          </div>
        )}
        {/* Button */}
        <PrimaryBtn onClick={handleGenerate} style={{background:'linear-gradient(145deg,#6366f1,#8b5cf6)'}}>
          ⚡ CREAR NOMS
        </PrimaryBtn>
      </div>
      {/* ── fi Apartat 3 ── */}

    </div>
  );
}

function ResultSection({title, names, mono, allResults, nameArr}) {
  if (!names||names.length===0) return null;
  return (
    <CollapsibleSection title={title} count={names.length}>
      <div style={{display:'flex',flexDirection:'column',gap:4,marginTop:4}}>
        {names.map((n,idx)=>(
          <div key={idx} style={{display:'flex',alignItems:'center',gap:6}}>
            <NameBox segments={n.segments} mono={mono} />
            <CopyBtn text={n.name} small />

        ))}
      </div>
    </CollapsibleSection>
  );
}

function Tab2({tweaks}) {
  const [input, setInput] = useState('1983-N-BABA_YAGA_Y_EL_LIBRO_DE_HECHIZOS-N-FTR-MASTER-ES-ORG-GRA-S-XXX-V01.mov');
  const [parsed, setParsed] = useState(null);
  const [drag, setDrag] = useState(false);

  useEffect(()=>{ setParsed(parseName(input)); }, []);

  const buildSegs = p => {
    if (!p) return [];
    const s=[];
    if(p.fields.ref){s.push({t:'REF',v:p.fields.ref});s.push({t:'SEP',v:'-N-'});}
    if(p.fields.titol){s.push({t:'TIT',v:p.fields.titol});s.push({t:'SEP',v:'-N-'});}
    if(p.fields.fmt){let fs=p.fields.fmt;if(p.fields.fmt==='SER'){if(p.fields.tmp)fs+=`_S${p.fields.tmp}`;if(p.fields.epi)fs+=`_E${p.fields.epi}`;}s.push({t:'FMT',v:fs});s.push({t:'SEP',v:'-'});}
    if(p.fields.prf){s.push({t:'PRF',v:p.fields.prf});s.push({t:'SEP',v:'-'});}
    if(p.fields.idi){s.push({t:'IDI',v:p.fields.idi});s.push({t:'SEP',v:'-'});}
    if(p.fields.ver){s.push({t:'VER',v:p.fields.ver});s.push({t:'SEP',v:'-'});}
    if(p.fields.vis){s.push({t:'VIS',v:p.fields.vis});s.push({t:'SEP',v:'-'});}
    if(p.fields.ls){s.push({t:'LS',v:p.fields.ls});s.push({t:'SEP',v:'-'});}
    if(p.fields.ta){const ts=p.fields.cn?`${p.fields.ta}_${p.fields.cn}`:p.fields.ta;s.push({t:'TA',v:ts});s.push({t:'SEP',v:'-'});}
    if(p.fields.vxx){s.push({t:'VXX',v:p.fields.vxx});}
    if(p.fields.ext) s.push({t:'EXT',v:p.fields.ext});
    while(s.length && s[s.length-1].t==='SEP') s.pop();
    return s;
  };

  const fieldOrder=['ref','titol','fmt','tmp','epi','prf','idi','ver','vis','ls','ta','vxx','ext','type'];

  return (
    <div style={{display:'flex',flexDirection:'column',gap:11}}>
      <div
        onDragOver={e=>{e.preventDefault();setDrag(true)}}
        onDragLeave={()=>setDrag(false)}
        onDrop={e=>{e.preventDefault();setDrag(false);const f=e.dataTransfer.files[0];if(f){setInput(f.name);setParsed(parseName(f.name));}}}
        style={{
          border:`2px dashed ${drag?'rgba(99,102,241,0.6)':'rgba(255,255,255,0.07)'}`,
          borderRadius:12,background:drag?'rgba(99,102,241,0.05)':'rgba(0,0,0,0.2)',
          padding:16,display:'flex',flexDirection:'column',gap:10,transition:'all 0.2s',
        }}
      >
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:10,color:T.text3,fontSize:12}}>
          <span style={{fontSize:22,opacity:0.6}}>📂</span>
          <span>Arrossega un fitxer aquí, o <span style={{color:'var(--accent)'}}>enganxa el nom a sota</span></span>
        </div>
        <input value={input}
          onChange={e=>{setInput(e.target.value);setParsed(parseName(e.target.value));}}
          placeholder="ex: 1983-N-BABA_YAGA-N-FTR-MASTER-ES-ORG-GRA-S-XXX-V01.mov"
          style={{width:'100%',fontFamily:tweaks.monoFont||'Courier New',fontSize:12}} />
        <div style={{fontSize:9.5,color:T.text3,textAlign:'center'}}>El fitxer no es mou ni modifica</div>
      </div>

      <PrimaryBtn onClick={()=>setParsed(parseName(input))} style={{background:'linear-gradient(145deg,#7c3aed,#4f46e5)'}}>
        🔍 DESXIFRAR NOM
      </PrimaryBtn>

      {parsed && Object.keys(parsed.fields).length>0 && (
        <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:12}}>
          {parsed.errors.length>0 && (
            <div style={{background:'rgba(239,68,68,0.08)',border:'1px solid rgba(239,68,68,0.2)',borderRadius:8,padding:'9px 14px',color:'#fca5a5',fontSize:11.5}}>
              ⚠ Segments no reconeguts: {parsed.errors.join(' · ')}
            </div>
          )}
          <div>
            <SectionLabel>Nom original — segments identificats</SectionLabel>
            <NameBox segments={buildSegs(parsed)} mono={tweaks.monoFont} />
          </div>
          <div>
            <SectionLabel>Camps desxifrats</SectionLabel>
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:7}}>
              {fieldOrder.map(key=>{
                const def=FIELD_DESCS[key]; if(!def) return null;
                if(key==='tmp'&&parsed.fields.fmt!=='SER') return null;
                if(key==='epi'&&parsed.fields.fmt!=='SER') return null;
                const val=key==='type'?parsed.fields.type:parsed.fields[key]; if(!val) return null;
                const typeColor=key==='type'?(val==='VÍDEO'?'#7dd3fc':val==='ÀUDIO'?'#fca5a5':'#9ca3af'):'#e8e8f4';
                const isErr=parsed.errors.some(e=>e.includes(key.toUpperCase()));
                return (
                  <div key={key} className={def.cls} style={{
                    gridColumn:def.span?`span ${def.span}`:undefined,
                    borderRadius:8,padding:'10px 13px',
                    background: isErr?'rgba(239,68,68,0.09)':'rgba(255,255,255,0.045)',
                    border:`1px solid rgba(255,255,255,0.09)`,
                    borderLeft:`3px solid ${isErr?'rgba(239,68,68,0.6)':'var(--fc-c,rgba(255,255,255,0.2))'}`,
                    boxShadow:'0 2px 8px rgba(0,0,0,0.2), 0 1px 0 rgba(255,255,255,0.06) inset',
                    display:'flex',flexDirection:'column',gap:3,
                  }}>
                    <span style={{fontSize:8.5,fontWeight:700,letterSpacing:'1.5px',textTransform:'uppercase',color:isErr?'#fca5a5':T.text3}}>
                      {def.label}
                    </span>
                    <span style={{fontFamily:tweaks.monoFont||'Courier New',fontSize:14,fontWeight:700,color:typeColor,letterSpacing:'0.02em'}}>
                      {val}
                    </span>
                    <span style={{fontSize:10,color:T.text3}}>{def.desc(val)}</span>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function Tab3({tweaks}) {
  const [rows, setRows] = useState([]);        // [{original, new, status}]
  const [csvRows, setCsvRows] = useState([]);   // raw rows from CSV parse
  const [csvPath, setCsvPath] = useState('');
  const [folderPath, setFolderPath] = useState('');
  const [logExp, setLogExp] = useState(''); // '' | 'ok' | 'err'
  const [renaming, setRenaming] = useState(false);

  // Rescan when both CSV and folder are loaded
  useEffect(() => {
    if (!csvPath || !folderPath || !csvRows.length || !window.bridge) return;
    let cancelled = false;
    (async () => {
      const raw = await new Promise(r => window.bridge.scan_folder_js(folderPath, JSON.stringify(csvRows), r));
      if (cancelled) return;
      try {
        const result = JSON.parse(raw);
        if (!result.error) setRows(result);
      } catch(e) {}
    })();
    return () => { cancelled = true; };
  }, [csvPath, folderPath, csvRows]);

  const stats = {
    total: rows.length,
    ok: rows.filter(r => r.status === 'found').length,
    miss: rows.filter(r => r.status === 'missing').length,
    warn: rows.filter(r => r.status === 'conflict').length,
    done: rows.filter(r => r.status === 'done').length,
  };

  const handlePickCsv = async () => {
    if (!window.bridge) return;
    const path = await new Promise(r => window.bridge.pick_csv(r));
    if (!path) return;
    setCsvRows([]);
    setRows([]);
    const raw = await new Promise(r => window.bridge.parse_csv(path, r));
    try {
      const data = JSON.parse(raw);
      if (!data.error) { setCsvPath(path); setCsvRows(data.rows); }
    } catch(e) {}
  };

  const handlePickFolder = async () => {
    if (!window.bridge) return;
    const path = await new Promise(r => window.bridge.pick_folder(r));
    if (path) setFolderPath(path);
  };

  const handleRename = async () => {
    if (!window.bridge || renaming) return;
    const foundRows = rows.filter(r => r.status === 'found');
    if (!foundRows.length) return;
    setRenaming(true);
    try {
      const conf = await new Promise(r => window.bridge.confirm_rename(String(foundRows.length), r));
      if (conf !== 'yes') return;
      const raw = await new Promise(r =>
        window.bridge.execute_rename_js(folderPath, JSON.stringify(foundRows), r)
      );
      try {
        const results = JSON.parse(raw);
        if (!results.error) {
          setRows(prev => prev.map(row => {
            const done = results.find(res => res.original === row.original);
            return done ? {...row, ok: done.ok, error: done.error, status: done.ok ? 'done' : 'error'} : row;
          }));
        }
      } catch(e) {}
    } finally {
      setRenaming(false);
    }
  };

  const exportLog = async () => {
    if (!window.bridge) return;
    const doneRows = rows.filter(r => r.status === 'done' || r.status === 'error');
    if (!doneRows.length) return;
    const raw = await new Promise(r => window.bridge.export_log_js(JSON.stringify(doneRows), r));
    try {
      const res = JSON.parse(raw);
      if (res.ok) { setLogExp('ok'); setTimeout(() => setLogExp(''), 2000); }
      else if (res.error !== "cancel·lat") { setLogExp('err'); setTimeout(() => setLogExp(''), 3000); }
    } catch(e) { setLogExp('err'); setTimeout(() => setLogExp(''), 3000); }
  };

  const statCfg = {
    found:   {row:'rgba(34,197,94,0.09)',bbg:'rgba(34,197,94,0.15)',bbd:'rgba(34,197,94,0.45)',bc:'#86efac',ic:'✓',lbl:'Trobat'},
    missing: {row:'rgba(239,68,68,0.08)',bbg:'rgba(239,68,68,0.14)',bbd:'rgba(239,68,68,0.45)',bc:'#fca5a5',ic:'✗',lbl:'No trobat'},
    conflict:{row:'rgba(245,158,11,0.08)',bbg:'rgba(245,158,11,0.13)',bbd:'rgba(245,158,11,0.45)',bc:'#fde68a',ic:'⚠',lbl:'Nom ja existeix'},
    done:    {row:'rgba(139,92,246,0.09)',bbg:'rgba(139,92,246,0.15)',bbd:'rgba(139,92,246,0.45)',bc:'#d8b4fe',ic:'✓',lbl:'Renombrat'},
    error:   {row:'rgba(239,68,68,0.08)',bbg:'rgba(239,68,68,0.14)',bbd:'rgba(239,68,68,0.45)',bc:'#fca5a5',ic:'✗',lbl:'Error'},
  };

  return (
    <div style={{display:'flex',flexDirection:'column',gap:11}}>
      {/* Inputs */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:11}}>
        <Card accent="rgba(99,102,241,0.5)">
          <SectionLabel>1 · Fitxer CSV</SectionLabel>
          <div style={{fontFamily:'Courier New',fontSize:11,color:'#86efac',background:'rgba(34,197,94,0.05)',border:'1px solid rgba(34,197,94,0.15)',borderRadius:6,padding:'6px 10px',wordBreak:'break-all',marginBottom:8}}>
            {csvPath || 'Cap fitxer CSV seleccionat'}
          </div>
          <SecondaryBtn color="rgba(99,102,241,0.4)" onClick={handlePickCsv}>📄 Canviar CSV…</SecondaryBtn>
          <div style={{fontSize:9.5,color:T.text3,marginTop:7}}>Format: nom_original,nom_nou · arrossega o selecciona</div>
        </Card>
        <Card accent="rgba(34,197,94,0.4)">
          <SectionLabel>2 · Carpeta dels fitxers</SectionLabel>
          <div style={{fontFamily:'Courier New',fontSize:11,color:'#86efac',background:'rgba(34,197,94,0.05)',border:'1px solid rgba(34,197,94,0.15)',borderRadius:6,padding:'6px 10px',wordBreak:'break-all',marginBottom:8}}>
            {folderPath || 'Cap carpeta seleccionada'}
          </div>
          <SecondaryBtn color="rgba(34,197,94,0.35)" onClick={handlePickFolder}>📁 Canviar carpeta…</SecondaryBtn>
          <div style={{fontSize:9.5,color:T.text3,marginTop:7}}>Cerca no recursiva (fitxers directament dins la carpeta)</div>
        </Card>
      </div>

      {/* Stats */}
      <div style={{display:'flex',gap:12,alignItems:'center',background:'rgba(255,255,255,0.04)',borderRadius:8,padding:'9px 14px',flexWrap:'wrap',border:'1px solid rgba(255,255,255,0.10)'}}>
        {[{dot:'#7dd3fc',n:stats.total,l:'total'},{dot:'#86efac',n:stats.ok,l:'trobats'},{dot:'#fca5a5',n:stats.miss,l:'no trobats'},{dot:'#fde68a',n:stats.warn,l:'conflictes'},...(stats.done>0?[{dot:'#d8b4fe',n:stats.done,l:'renombrats'}]:[])].map((s,i)=>(
          <React.Fragment key={i}>
            {i>0 && <span style={{color:'rgba(255,255,255,0.08)'}}>·</span>}
            <div style={{display:'flex',alignItems:'center',gap:5,fontSize:11.5}}>
              <div style={{width:7,height:7,borderRadius:'50%',background:s.dot,boxShadow:`0 0 6px ${s.dot}88`}} />
              <span style={{fontWeight:700,color:T.text}}>{s.n}</span>
              <span style={{color:T.text3}}>{s.l}</span>
            </div>
          </React.Fragment>
        ))}
        <div style={{flex:1}} />
        <span style={{fontSize:10.5,color:T.text2}}>Es renombraran <strong style={{color:T.text}}>{stats.ok}</strong> fitxers</span>
      </div>


      {/* Table */}
      <div style={{border:'1px solid rgba(255,255,255,0.06)',borderRadius:10,overflow:'hidden',boxShadow:'0 4px 16px rgba(0,0,0,0.4)'}}>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:11}}>
          <thead>
            <tr style={{background:'rgba(255,255,255,0.03)',borderBottom:'1px solid rgba(255,255,255,0.06)'}}>
              {['#','Nom original','','Nom nou','Estat'].map((h,i)=>(
                <th key={i} style={{textAlign:'left',fontSize:9,fontWeight:700,letterSpacing:'1.2px',textTransform:'uppercase',color:T.text3,padding:'8px 11px'}}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.length===0 && (
              <tr><td colSpan={5} style={{textAlign:'center',padding:'32px 16px',color:T.text3,fontSize:12}}>
                Carrega un CSV i selecciona una carpeta per veure la previsualització
              </td></tr>
            )}
            {rows.map((row,idx)=>{
              const c=statCfg[row.status]||statCfg.missing;
              return (
                <tr key={idx} style={{borderBottom:'1px solid rgba(255,255,255,0.05)',background:c.row,transition:'background 0.15s'}}>
                  <td style={{padding:'8px 11px',color:T.text2,fontSize:10,width:28}}>{idx+1}</td>
                  <td style={{padding:'8px 11px',fontFamily:'Courier New',color:T.text2,maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{row.original}</td>
                  <td style={{padding:'8px 7px',color:T.text3,fontSize:14,width:30,textAlign:'center'}}>→</td>
                  <td style={{padding:'8px 11px',fontFamily:'Courier New',color:row.status==='missing'?T.text3:T.text,maxWidth:360,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{row.new}</td>
                  <td style={{padding:'8px 11px',whiteSpace:'nowrap'}}>
                    <span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'3px 9px',borderRadius:20,fontSize:10,fontWeight:700,background:c.bbg,border:`1px solid ${c.bbd}`,color:c.bc,boxShadow:`0 1px 4px rgba(0,0,0,0.3), 0 0 8px ${c.bbd}44`}}>
                      {c.ic} {c.lbl}
                    </span>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {/* Actions */}
      <div style={{display:'flex',gap:8}}>
        <PrimaryBtn onClick={handleRename}
          style={{
            ...(stats.ok>0 && !renaming ? {background:'linear-gradient(145deg,#166534,#15803d)'} : {}),
            opacity: (stats.ok===0 || renaming) ? 0.4 : 1,
            cursor: (stats.ok===0 || renaming) ? 'not-allowed' : 'pointer',
          }}>
          {renaming ? '⏳ Renombrant…' : `✅ Renombrar ${stats.ok} fitxers trobats`}
        </PrimaryBtn>
        <SecondaryBtn onClick={exportLog}
          color={logExp==='ok'?'rgba(34,197,94,0.4)':logExp==='err'?'rgba(239,68,68,0.4)':'rgba(99,102,241,0.3)'}
          style={{whiteSpace:'nowrap',padding:'11px 18px'}}>
          {logExp==='ok'?'✓ Exportat':logExp==='err'?'✗ Error exportant':'📋 Exportar log'}
        </SecondaryBtn>
      </div>
      <div style={{fontSize:10,color:T.text3,textAlign:'center'}}>Els fitxers no trobats i els conflictes s'ignoraran</div>
    </div>
  );
}

function SecondaryBtn({children, onClick, color, style}) {
  const [hov, setHov] = useState(false);
  const [press, setPress] = useState(false);
  return (
    <button
      onClick={onClick}
      onMouseEnter={()=>setHov(true)} onMouseLeave={()=>{setHov(false);setPress(false);}}
      onMouseDown={()=>setPress(true)} onMouseUp={()=>setPress(false)}
      style={{
        padding:'6px 14px', borderRadius:8, fontSize:11.5, fontWeight:600,
        cursor:'pointer', border:`1px solid ${color||'rgba(255,255,255,0.1)'}`,
        background: hov ? (color?color.replace('0.4','0.15').replace('0.3','0.1'):'rgba(255,255,255,0.06)') : 'rgba(255,255,255,0.03)',
        color: T.text2,
        transform: press?'scale(0.97)':'scale(1)',
        boxShadow: press?'none':'0 1px 4px rgba(0,0,0,0.3), 0 1px 0 rgba(255,255,255,0.05) inset',
        transition:'all 0.12s',
        ...style,
      }}
    >{children}</button>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
const TABS = ['① Crear noms','② Desxifrar nom','③ Renombrar per lots'];

function App() {
  const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
  const [activeTab, setActiveTab] = useState(0);
  const [, forceUpdate] = useState(0);
  const t = tweaks || TWEAK_DEFAULTS;
  const accent = t.accentColor || '#7c7ff5';
  const theme = BG_THEMES[t.bgTheme] || BG_THEMES.zinc;
  const glowA = GLOW_STRENGTH[t.glowIntensity] || GLOW_STRENGTH.medium;

  useEffect(()=>{
    applyTheme(theme, t.customBg || null);
    document.documentElement.style.setProperty('--accent', accent);
    document.documentElement.style.setProperty('--accent-dim', hexToRgba(accent, 0.15));
    forceUpdate(n => n + 1);
  },[accent, t.bgTheme, t.customBg]);

  const taBlocksDynamic = [
    {id:'MIX',label:'MIX',desc:'Mescla completa',color:t.colorTA_MIX||'#818cf8',defCh:'2_0'},
    {id:'ME', label:'ME', desc:'Music & Effects',color:t.colorTA_ME||'#34d399',defCh:'2_0'},
    {id:'DX', label:'DX', desc:'Diàlegs',         color:t.colorTA_DX||'#fb923c',defCh:'1'},
  ];

  const tweakColors = {
    prf: t.colorPrf || '#22d3ee',
    vis: t.colorVis || '#a78bfa',
    fmt: t.colorFmt || '#4ade80',
    idi: t.colorIdi || '#f472b6',
  };


  const isDark = T.dark !== false;

  return (
    <div style={{height:'100vh', overflow:'hidden', display:'flex', flexDirection:'column', padding:'22px 24px 0', maxWidth:1020, margin:'0 auto', boxSizing:'border-box'}}>

      {/* Header */}
      <div style={{marginBottom:18, display:'flex', alignItems:'center', gap:12}}>
        <div style={{
          width:36, height:36, borderRadius:10,
          background:`linear-gradient(135deg, ${accent}, ${hexToRgba(accent,0.6)})`,
          boxShadow:`0 4px 14px ${hexToRgba(accent,0.4)}, 0 1px 0 rgba(255,255,255,0.15) inset`,
          display:'flex', alignItems:'center', justifyContent:'center',
          fontSize:17, flexShrink:0, color:'#fff',
        }}>◈</div>
        <div>
          <div style={{fontSize:18, fontWeight:700, color:T.text, letterSpacing:'-0.01em', lineHeight:1.2}}>NomsMasters</div>
          <div style={{fontSize:11, color:T.text3, marginTop:1}}>Generador i desxifrador de nomenclatura de màsters</div>
        </div>
      </div>

      {/* Tab bar */}
      <div style={{display:'flex', gap:3, marginBottom:0, position:'relative'}}>
        <div style={{position:'absolute',bottom:0,left:0,right:0,height:'1px',background:isDark?'rgba(255,255,255,0.07)':'rgba(0,0,0,0.10)'}} />
        {TABS.map((tab,i)=>{
          const isActive = activeTab===i;
          return (
            <div key={i} onClick={()=>setActiveTab(i)} style={{
              padding:'9px 18px', cursor:'pointer', borderRadius:'8px 8px 0 0',
              fontSize:12, fontWeight:600, letterSpacing:'0.02em',
              background: isActive ? (isDark?'rgba(255,255,255,0.05)':'rgba(255,255,255,0.9)') : 'transparent',
              border: isActive ? `1px solid ${isDark?'rgba(255,255,255,0.10)':'rgba(0,0,0,0.12)'}` : '1px solid transparent',
              borderBottom: 'none',
              color: isActive ? T.text : T.text3,
              position:'relative', zIndex: isActive?2:1, marginBottom: isActive?-1:0,
              userSelect:'none', transition:'all 0.15s',
              boxShadow: isActive ? `0 -2px 0 ${accent} inset` : 'none',
            }}>{tab}</div>
          );
        })}
      </div>

      {/* Panel */}
      <div style={{
        background: isDark ? 'rgba(255,255,255,0.04)' : 'rgba(255,255,255,0.7)',
        border: isDark ? '1px solid rgba(255,255,255,0.10)' : '1px solid rgba(0,0,0,0.09)',
        borderTop:'none', borderRadius:'0 0 12px 12px', padding:0, flex:1, display:'flex', flexDirection:'column', overflow:'hidden',
        boxShadow: isDark ? '0 8px 32px rgba(0,0,0,0.3), 0 1px 0 rgba(255,255,255,0.06) inset' : '0 4px 20px rgba(0,0,0,0.08)',
      }}>
        <div style={{display:activeTab===0?'flex':'none',flexDirection:'column',flex:1,minHeight:0,height:'100%'}}><Tab1 tweaks={t} setTweak={setTweak} tweakColors={tweakColors} glowA={glowA} taBlocksDynamic={taBlocksDynamic} /></div>
        <div style={{display:activeTab===1?'block':'none',padding:'20px',overflowY:'auto',flex:1}}><Tab2 tweaks={t} /></div>
        <div style={{display:activeTab===2?'block':'none',padding:'20px',overflowY:'auto',flex:1}}><Tab3 tweaks={t} /></div>
      </div>

      {/* Tweaks Panel */}
      <window.TweaksPanel>
        <window.TweakSection label="Tema de fons">
          <div style={{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:5, marginTop:2}}>
            {Object.entries(BG_THEMES).map(([k,v])=>(
              <div key={k} onClick={()=>{setTweak('bgTheme',k);setTweak('customBg','');}} style={{
                height:32, borderRadius:7, cursor:'pointer',
                background: v.dark ? (typeof v.bg==='string'&&v.bg.startsWith('linear')?v.bg:v.bg) : v.bg,
                border: `2px solid ${t.bgTheme===k && !t.customBg ? accent : 'rgba(0,0,0,0.15)'}`,
                display:'flex', alignItems:'center', justifyContent:'center',
                fontSize:9, fontWeight:700,
                color: v.dark?'rgba(255,255,255,0.8)':'rgba(0,0,0,0.6)',
                letterSpacing:'0.5px', textTransform:'uppercase', transition:'all 0.15s',
                boxShadow: t.bgTheme===k && !t.customBg ? `0 0 10px ${hexToRgba(accent,0.5)}` : '0 1px 3px rgba(0,0,0,0.15)',
              }}>{k}</div>
            ))}
          </div>
          <div style={{marginTop:8}}>
            <window.TweakColor label="Color personalitzat" value={t.customBg||'#f4f4f5'} onChange={v=>setTweak('customBg',v)} />
            {t.customBg && <div onClick={()=>setTweak('customBg','')} style={{fontSize:10,color:accent,cursor:'pointer',marginTop:4,textAlign:'right'}}>↩ Tornar als presets</div>}
          </div>
          <window.TweakToggle label="Mode clar (light mode)" value={t.customBg ? !isColorDark(t.customBg) : !!(t.bgTheme&&!BG_THEMES[t.bgTheme]?.dark)} onChange={v=>{ if(v){setTweak('bgTheme','zinc');setTweak('customBg','');}else{setTweak('bgTheme','dark');setTweak('customBg','');} }} />
        </window.TweakSection>

        <window.TweakSection label="Accent i estil">
          <window.TweakColor label="Color d'accent" value={t.accentColor||'#7c7ff5'} onChange={v=>setTweak('accentColor',v)} />
          <window.TweakRadio label="Glow" value={t.glowIntensity||'medium'} options={['subtle','medium','strong']} onChange={v=>setTweak('glowIntensity',v)} />
          <window.TweakRadio label="Estil botó" value={t.btnStyle||'gradient'} options={['gradient','flat','outline']} onChange={v=>setTweak('btnStyle',v)} />
        </window.TweakSection>

        <window.TweakSection label="Colors de pills">
          <window.TweakColor label="PRF (Perfil)" value={t.colorPrf||'#22d3ee'} onChange={v=>setTweak('colorPrf',v)} />
          <window.TweakColor label="VIS (Estat visual)" value={t.colorVis||'#a78bfa'} onChange={v=>setTweak('colorVis',v)} />
          <window.TweakColor label="FMT (Tipus ref.)" value={t.colorFmt||'#4ade80'} onChange={v=>setTweak('colorFmt',v)} />
          <window.TweakColor label="IDI (Idiomes)" value={t.colorIdi||'#f472b6'} onChange={v=>setTweak('colorIdi',v)} />
        </window.TweakSection>

        <window.TweakSection label="Colors blocs TA">
          <window.TweakColor label="MIX" value={t.colorTA_MIX||'#818cf8'} onChange={v=>setTweak('colorTA_MIX',v)} />
          <window.TweakColor label="ME" value={t.colorTA_ME||'#34d399'} onChange={v=>setTweak('colorTA_ME',v)} />
          <window.TweakColor label="DX" value={t.colorTA_DX||'#fb923c'} onChange={v=>setTweak('colorTA_DX',v)} />
        </window.TweakSection>

        <window.TweakSection label="General">
          <window.TweakRadio label="Densitat" value={t.density||'compact'} options={['normal','compact']} onChange={v=>setTweak('density',v)} />
          <window.TweakToggle label="Incloure extensió" value={!!t.showExtension} onChange={v=>setTweak('showExtension',v)} />
          <window.TweakSelect label="Font monospace" value={t.monoFont||'Courier New'} onChange={v=>setTweak('monoFont',v)} options={['Consolas','Courier New','monospace']} />
        </window.TweakSection>
      </window.TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
